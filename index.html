<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>土曜シフト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f1; --card: #ffffff; --ink: #121216; --ink2: #3b3b44; --sub: #86868f; --line: #e9e9e4; --soft: #f0f0ec;
    --ok: #10b981; --ok-ink: #047857; --ok-soft: #e7f8f1;
    --off: #f43f5e; --off-ink: #be123c; --off-soft: #ffe9ee;
    --warn-ink: #b45309; --warn-soft: #fff4e0;
    --arao: #059669; --arao-soft: #e3f6ee; --omuta: #ea7a1a; --omuta-soft: #fff0e2; --kuma: #6d5ef5; --kuma-soft: #efedff;
    --r: 20px; --shadow: 0 1px 1px rgba(18,18,22,.03), 0 6px 20px rgba(18,18,22,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", sans-serif; font-weight: 500; padding-bottom: 116px; -webkit-font-smoothing: antialiased; }
  .num { font-family: "Outfit", sans-serif; font-feature-settings: "tnum"; }
  button { font-family: inherit; cursor: pointer; color: inherit; }

  /* header */
  header { position: sticky; top: 0; z-index: 5; background: rgba(244,244,241,.88); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); padding: calc(12px + env(safe-area-inset-top)) 18px 10px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: "Outfit"; font-weight: 800; font-size: 15px; letter-spacing: -.02em; }
  .logo b { display: block; font-size: 17px; font-weight: 900; letter-spacing: .02em; line-height: 1.15; }
  .logo small { display: block; font-family: "Outfit"; font-size: 10px; font-weight: 600; color: var(--sub); letter-spacing: .2em; }
  .who { display: flex; align-items: center; gap: 8px; background: var(--card); border: 0; border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }
  .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 900; background: var(--ink); flex: 0 0 auto; }
  .who.admin .av { background: var(--kuma); }
  .months { display: flex; gap: 6px; margin-top: 12px; background: #e8e8e3; border-radius: 14px; padding: 4px; }
  .mchip { flex: 1; border: 0; border-radius: 10px; padding: 9px 4px; font-size: 15px; font-weight: 700; background: transparent; color: var(--sub); }
  .mchip.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  main { padding: 6px 18px 0; max-width: 560px; margin: 0 auto; }
  .card { background: var(--card); border-radius: var(--r); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .note { font-size: 12px; color: var(--sub); line-height: 1.7; }
  .sec { font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .08em; margin: 18px 4px 8px; }

  /* status panel */
  .panel { display: flex; align-items: center; gap: 14px; }
  .ring { --p: 0; width: 58px; height: 58px; border-radius: 50%; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--soft) 0); display: grid; place-items: center; flex: 0 0 auto; }
  .ring span { width: 46px; height: 46px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 15px; font-weight: 800; }
  .panel b { display: block; font-size: 16px; font-weight: 900; }
  .banner { border-radius: 14px; padding: 11px 13px; font-size: 13px; font-weight: 700; margin-bottom: 12px; line-height: 1.55; }
  .banner.lock { background: var(--kuma-soft); color: #4c3fd6; }
  .banner.todo { background: var(--warn-soft); color: var(--warn-ink); }
  .banner.done { background: var(--ok-soft); color: var(--ok-ink); }
  .banner.err { background: var(--off-soft); color: var(--off-ink); }

  /* day card */
  .day { position: relative; overflow: hidden; }
  .day::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--line); }
  .day.st3::before { background: var(--ok); } .day.st1::before { background: var(--off); } .day.stF::before { background: var(--kuma); }
  .day-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .date { display: flex; align-items: baseline; gap: 7px; }
  .date b { font-family: "Outfit"; font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .date span { font-family: "Outfit"; font-size: 11px; font-weight: 700; color: var(--sub); letter-spacing: .16em; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .t-荒尾 { color: var(--arao); background: var(--arao-soft); } .t-大牟田 { color: var(--omuta); background: var(--omuta-soft); } .t-熊本 { color: var(--kuma); background: var(--kuma-soft); }
  .memo { font-size: 12px; color: var(--ink2); background: var(--soft); border-radius: 10px; padding: 6px 10px; margin: -2px 0 12px; display: inline-block; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { border: 1.5px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 6px; font-size: 16px; font-weight: 900; min-height: 60px; transition: transform .1s ease, background .15s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .opt small { font-size: 11px; font-weight: 500; color: var(--sub); }
  .opt:active { transform: scale(.97); }
  .opt.s3.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.s1.on { background: var(--off); border-color: var(--off); color: #fff; }
  .opt.on small { color: rgba(255,255,255,.85); }
  .opt:disabled { opacity: .45; }
  .fixed { font-size: 14px; font-weight: 700; color: #4c3fd6; background: var(--kuma-soft); border-radius: 14px; padding: 14px; text-align: center; }

  .count { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .count b { font-size: 15px; font-weight: 900; }
  .stepper { display: flex; align-items: center; gap: 4px; background: var(--soft); border-radius: 999px; padding: 4px; }
  .stepper button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--card); font-size: 19px; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .stepper span { font-family: "Outfit"; font-size: 22px; font-weight: 800; min-width: 34px; text-align: center; }
  .stepper.sm button { width: 30px; height: 30px; font-size: 16px; }
  .stepper.sm span { font-size: 15px; min-width: 40px; }

  /* my schedule */
  .me-card { background: var(--ink); color: #fff; }
  .me-card .ttl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .me-card .ttl b { font-size: 15px; font-weight: 900; }
  .me-card .ttl span { font-size: 12px; opacity: .6; }
  .mine { list-style: none; margin: 0; padding: 0; }
  .mine li { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid rgba(255,255,255,.1); }
  .mine .d { font-family: "Outfit"; font-size: 22px; font-weight: 800; }
  .mine .d small { font-size: 11px; opacity: .55; margin-left: 6px; letter-spacing: .14em; }
  .me-card .tag { background: rgba(255,255,255,.12); }
  .me-card .t-荒尾 { color: #6ee7b7; } .me-card .t-大牟田 { color: #fdba74; } .me-card .t-熊本 { color: #c4b5fd; }
  .me-card .empty { color: rgba(255,255,255,.65); padding: 8px 0 2px; }
  .gapnote { margin-top: 10px; font-size: 12px; font-weight: 700; color: #fcd34d; }
  .empty { color: var(--sub); font-size: 14px; }

  /* shift table */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col { background: var(--soft); border-radius: 14px; padding: 10px; }
  .col-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .col-h .n { font-size: 11px; color: var(--sub); font-weight: 700; }
  .names { display: flex; flex-direction: column; gap: 5px; }
  .nm { font-size: 14px; font-weight: 700; background: var(--card); border-radius: 10px; padding: 7px 9px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .nm .c { font-family: "Outfit"; font-size: 11px; color: var(--sub); font-weight: 600; }
  .nm.me { background: var(--ink); color: #fff; } .nm.me .c { color: rgba(255,255,255,.6); }
  .nm.short { background: var(--off-soft); color: var(--off-ink); justify-content: center; }
  .nm.man { box-shadow: inset 0 0 0 1.5px var(--kuma); }

  /* admin */
  .vet { font-size: 10px; font-weight: 700; color: var(--warn-ink); background: var(--warn-soft); border-radius: 6px; padding: 1px 5px; margin-left: 2px; vertical-align: 1px; }
  .x { border: 0; background: var(--soft); width: 22px; height: 22px; border-radius: 50%; font-size: 12px; line-height: 1; color: var(--sub); flex: 0 0 auto; }
  .add { border: 1.5px dashed #cfcfc8; background: transparent; border-radius: 10px; padding: 7px; font-size: 13px; font-weight: 700; color: var(--sub); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0; }
  .row .lb { font-size: 12px; font-weight: 700; color: var(--sub); min-width: 36px; }
  .mini { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.7; }
  .mini b { color: var(--ink2); }
  .btn { border: 0; border-radius: 14px; padding: 13px 16px; font-size: 15px; font-weight: 900; background: var(--ink); color: #fff; width: 100%; }
  .btn.ghost { background: var(--soft); color: var(--ink); }
  .warnlist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .warnlist span { background: var(--off-soft); color: var(--off-ink); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .pin { width: 100%; font-family: "Outfit"; font-size: 28px; font-weight: 700; letter-spacing: .5em; text-align: center; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; margin: 12px 0; background: var(--soft); }

  /* sheet (bottom) */
  .shade { position: fixed; inset: 0; background: rgba(18,18,22,.4); z-index: 20; display: none; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 24px 24px 0 0; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); max-height: 78vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s ease; }
  .sheet.show { transform: none; } .shade.show { display: block; }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { margin: 0 0 10px; font-size: 17px; font-weight: 900; }
  .cand { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: var(--soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 7px; font-size: 15px; font-weight: 700; text-align: left; }
  .cand .st { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; }
  .st.s3 { background: var(--ok-soft); color: var(--ok-ink); } .st.s1 { background: var(--off-soft); color: var(--off-ink); } .st.s0 { background: var(--card); color: var(--sub); }
  .cand small { display: block; font-size: 11px; color: var(--sub); font-weight: 500; }

  /* nav */
  nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: calc(100% - 36px); max-width: 440px; background: rgba(18,18,22,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 22px; display: flex; padding: 6px; gap: 4px; z-index: 6; box-shadow: 0 14px 34px rgba(18,18,22,.28); }
  nav button { flex: 1; border: 0; border-radius: 16px; padding: 11px 4px; font-size: 14px; font-weight: 700; background: transparent; color: rgba(255,255,255,.55); }
  nav button.on { background: #fff; color: var(--ink); }

  /* pick */
  .hello { font-size: 25px; font-weight: 900; margin: 16px 2px 6px; line-height: 1.4; letter-spacing: .01em; }
  .pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 16px; }
  .pick button { display: flex; flex-direction: column; align-items: center; gap: 8px; border: 0; background: var(--card); border-radius: 18px; padding: 15px 4px 13px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow); transition: transform .1s ease; }
  .pick button:active { transform: scale(.96); }
  .pick .av { width: 40px; height: 40px; font-size: 16px; }
  .link { display: block; margin: 22px auto 0; border: 0; background: none; font-size: 13px; font-weight: 700; color: var(--sub); text-decoration: underline; text-underline-offset: 3px; }

  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(8px); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; max-width: calc(100% - 36px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .busy { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 6px 14px; z-index: 30; display: none; }
  .busy.show { display: block; }
  .loading { text-align: center; padding: 90px 0; color: var(--sub); font-size: 14px; }
  .sp { width: 30px; height: 30px; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; margin: 0 auto 14px; animation: r .8s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  /* ---- パソコン（横幅が広いとき） ---- */
  .grid { display: block; }
  @media (min-width: 900px) {
    body { padding-bottom: 40px; }
    header { padding: 16px 32px 12px; }
    .wrap, main { max-width: 1180px; }
    main { padding: 10px 32px 0; }
    .top { min-height: 44px; }
    .months { max-width: 420px; margin: 12px 0 0; }
    nav { top: 18px; bottom: auto; width: 340px; box-shadow: 0 6px 18px rgba(18,18,22,.18); z-index: 7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-items: start; }
    .grid > .card { margin-bottom: 0; }
    main > .card, main > .banner { max-width: 720px; }
    .me-card { max-width: 720px; }
    .pick { grid-template-columns: repeat(5, 1fr); max-width: 760px; }
    .hello { font-size: 30px; margin-top: 24px; }
    .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 480px; max-height: 80vh; border-radius: 24px; transform: translate(-50%, -40%); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    .sheet.show { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
    .grip { display: none; }
    .toast { bottom: 28px; }
    .opt:hover, .pick button:hover, .cand:hover, .chip:hover { filter: brightness(.97); }
  }
  /* ===== カラーテーマ（おしゃれ版） ===== */
  :root { --grad: linear-gradient(120deg, #6366f1 0%, #a855f7 50%, #ec4899 100%); --grad-ok: linear-gradient(135deg, #34d399, #14b8a6); --grad-off: linear-gradient(135deg, #fb7185, #f97316); --glass: rgba(255,255,255,.78); }
  body { background:
      radial-gradient(900px 500px at -10% -10%, #e0e7ff 0%, transparent 60%),
      radial-gradient(800px 500px at 110% 0%, #fce7f3 0%, transparent 55%),
      radial-gradient(900px 600px at 50% 110%, #d1fae5 0%, transparent 60%),
      #f7f6fb; background-attachment: fixed; }
  html { background: #f7f6fb; }
  header { background: rgba(247,246,251,.72); }
  .mark { background: var(--grad); box-shadow: 0 6px 16px rgba(168,85,247,.35); }
  .logo b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.7); box-shadow: 0 1px 1px rgba(80,60,140,.03), 0 10px 30px rgba(80,60,140,.08); }
  .months { background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.8); }
  .mchip.on { background: var(--grad); color: #fff; box-shadow: 0 6px 14px rgba(168,85,247,.3); }
  nav { background: rgba(255,255,255,.82); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 14px 34px rgba(80,60,140,.18); }
  nav button { color: #8b8aa3; }
  nav button.on { background: var(--grad); color: #fff; box-shadow: 0 6px 14px rgba(168,85,247,.35); }
  .who { background: rgba(255,255,255,.85); }
  .ring { background: conic-gradient(#a855f7 0%, #ec4899 calc(var(--p) * 1%), #ece9f6 0); }
  .opt { background: rgba(255,255,255,.9); border-color: #ebe8f4; }
  .opt.s3.on { background: var(--grad-ok); border-color: transparent; box-shadow: 0 8px 18px rgba(20,184,166,.3); }
  .opt.s1.on { background: var(--grad-off); border-color: transparent; box-shadow: 0 8px 18px rgba(249,115,22,.28); }
  .day.st3::before { background: var(--grad-ok); } .day.st1::before { background: var(--grad-off); } .day.stF::before { background: var(--grad); }
  .me-card { background: var(--grad); border: 0; box-shadow: 0 16px 34px rgba(168,85,247,.32); }
  .me-card .tag { background: rgba(255,255,255,.22); } .me-card .t-荒尾, .me-card .t-大牟田, .me-card .t-熊本 { color: #fff; }
  .me-card .gapnote { color: #fff7c2; }
  .col { background: rgba(245,243,252,.9); }
  .nm { background: #fff; }
  .nm.me { background: var(--grad); }
  .banner.todo { background: linear-gradient(120deg, #fff4e0, #ffe8f0); }
  .banner.done { background: linear-gradient(120deg, #e3f8ef, #e0f2fe); }
  .banner.lock { background: linear-gradient(120deg, #eef0ff, #f5e9ff); }
  .btn { background: var(--grad); box-shadow: 0 8px 18px rgba(168,85,247,.3); }
  .btn.ghost { background: #efedf7; box-shadow: none; }
  .chip.on { background: var(--grad); border-color: transparent; }
  .pick button { background: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.9); }
  .hello { background: linear-gradient(120deg, #312e81, #9d174d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .toast { background: #312e81; }
  .busy { background: var(--grad); }
  .who.admin .av { background: var(--grad); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo"><div class="mark">SAT</div><div><small>SATURDAY SHIFT</small><b>土曜シフト</b></div></div>
      <button class="who" id="who" style="display:none"></button>
    </div>
    <div class="months" id="months" style="display:none"></div>
  </div>
</header>
<main id="main"><div class="loading"><div class="sp"></div>読み込み中…</div></main>
<nav id="nav" style="display:none"></nav>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy">反映中…</div>
<script>
window.onerror = function (msg, src, line) { toast('⚠ エラー: ' + msg + ' (' + line + ')', 6000); };
var API_URL = 'https://script.google.com/macros/s/AKfycbz7tUsYqXr9cM4ScKVBlwOwRYz52bErrEUGJjteGPC1ptd3c0xNqOHtMsLzwKOAxdIM/exec';
var S = { data: null, me: null, mk: null, tab: 'in', busy: 0, pin: null, pinMode: false };
var CIRC = ['', '①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩'];
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(t, ms) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, ms || 1800); }
// 名前ごとに色を変えたアイコン
var AV_COLORS = [['#6366f1', '#a855f7'], ['#ec4899', '#f97316'], ['#14b8a6', '#22c55e'], ['#0ea5e9', '#6366f1'], ['#f59e0b', '#ef4444'], ['#8b5cf6', '#ec4899'], ['#10b981', '#0ea5e9'], ['#f43f5e', '#a855f7']];
function av(n) {
  var h = 0; String(n).split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; });
  var c = AV_COLORS[h % AV_COLORS.length];
  return '<span class="av" style="background:linear-gradient(135deg,' + c[0] + ',' + c[1] + ')">' + esc(String(n).charAt(0)) + '</span>';
}
function md(label) { var m = String(label).match(/^(\d+\/\d+)/); return m ? m[1] : label; }
function dateHtml(label) { return '<div class="date"><b>' + esc(md(label)) + '</b><span>SAT</span></div>'; }
function tag(c, extra) { return '<span class="tag t-' + c + '">' + esc(c) + (extra ? '（' + esc(extra) + '）' : '') + '</span>'; }
function setBusy() { $('busy').classList.toggle('show', S.busy > 0); }

// ---- 通信（GitHub Pages では fetch、Googleの画面では google.script.run） ----
function call(fn, args, ok) {
  S.busy++; setBusy();
  var done = function (d) { S.busy--; setBusy(); ok(d); };
  var fail = function (e) { S.busy--; setBusy(); toast('⚠ ' + (e && e.message ? e.message : '通信エラー'), 3500); if (fn !== 'apiGetData') load(); };
  if (window.google && google.script && google.script.run) { google.script.run.withSuccessHandler(done).withFailureHandler(fail)[fn].apply(null, args || []); return; }
  var body = null;
  if (fn === 'apiSave') body = { name: args[0], key: args[1], day: args[2], value: args[3] };
  if (fn === 'apiAdmin') { body = args[2] || {}; body.admin = true; body.pin = args[0]; body.action = args[1]; }
  var req = body ? fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    : fetch(API_URL + '?api=data&t=' + Date.now());
  req.then(function (r) { return r.json(); })
    .then(function (j) { if (j.ok) done(j.data); else fail(new Error(j.error)); })
    .catch(function () { fail(new Error('通信エラー。電波の良いところでもう一度お試しください')); });
}
function load() { call('apiGetData', [], function (d) { S.data = d; boot(); }); }
function admin(action, b) { call('apiAdmin', [S.pin, action, b], function (d) { S.data = d; if (!S.busy) render(); toast('✓ 反映しました'); }); }

function month() { return S.data.months.filter(function (m) { return m.key === S.mk; })[0]; }
function meInfo() { return S.data.staff.filter(function (s) { return s.name === S.me; })[0] || { where: '' }; }

function boot() {
  var saved = store('shift_me'); S.pin = store('shift_pin');
  if (!S.me && saved && (saved === '__admin__' ? S.pin : S.data.staff.some(function (s) { return s.name === saved; }))) S.me = saved;
  if (S.me === '__admin__') S.tab = S.tab === 'in' ? 'ad' : S.tab;
  if (!S.mk || !month()) {
    var now = new Date(), cand = S.data.months.filter(function (m) { return m.year * 12 + m.month >= now.getFullYear() * 12 + now.getMonth() + 1; });
    S.mk = (cand[0] || S.data.months[0] || {}).key;
  }
  render();
}

function render() {
  closeSheet();
  if (!S.me) return renderPick();
  var isAd = S.me === '__admin__';
  $('who').style.display = ''; $('who').className = 'who' + (isAd ? ' admin' : '');
  $('who').innerHTML = isAd ? '<span class="av">係</span>シフト係' : av(S.me) + esc(S.me) + ' さん';
  $('months').style.display = '';
  $('months').innerHTML = S.data.months.map(function (m) {
    return '<button class="mchip' + (m.key === S.mk ? ' on' : '') + '" data-mk="' + m.key + '">' + m.month + '月' + (m.locked ? ' 🔒' : '') + '</button>';
  }).join('');
  var tabs = isAd ? [['ad', '修正する'], ['sh', 'シフトを見る']] : [['in', '希望を出す'], ['sh', 'シフトを見る']];
  $('nav').style.display = '';
  $('nav').innerHTML = tabs.map(function (t) { return '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('');
  var m = month();
  if (!m) { $('main').innerHTML = '<div class="card empty">まだ月が作られていません</div>'; return; }
  $('main').innerHTML = S.tab === 'sh' ? renderShift(m) : isAd ? renderAdmin(m) : renderInput(m);
}

function renderPick() {
  $('who').style.display = 'none'; $('nav').style.display = 'none'; $('months').style.display = 'none';
  if (S.pinMode) {
    $('main').innerHTML = '<div class="hello">シフト係モード</div><div class="card"><div class="note">暗証番号を入れてください</div>' +
      '<input id="pin" class="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">' +
      '<button class="btn" data-act="pinok">ひらく</button><button class="link" data-act="pinback">もどる</button></div>';
    setTimeout(function () { var p = $('pin'); if (p) p.focus(); }, 50);
    return;
  }
  $('main').innerHTML = '<div class="hello">おつかれさまです 👋<br>名前をえらんでください</div>' +
    '<div class="note">次からは自動でひらきます。</div><div class="pick">' +
    S.data.staff.map(function (s) { return '<button data-me="' + esc(s.name) + '">' + av(s.name) + esc(s.name) + '</button>'; }).join('') + '</div>' +
    '<button class="link" data-act="pinmode">シフト係の方はこちら</button>';
}

function clinicsFor(d, info) {
  var t = [];
  if (d.bNeed > 0 && info.where !== '熊本のみ') t.push(d.branch);
  if (d.kNeed > 0 && info.where !== '分院のみ') t.push('熊本');
  return t;
}

// ---- スタッフ：希望を出す ----
function renderInput(m) {
  var info = meInfo(), pref = m.pref[S.me] || [], h = '';
  var open = 0, filled = 0;
  m.days.forEach(function (d, i) { if (clinicsFor(d, info).length) { open++; if (pref[i]) filled++; } });
  var pct = open ? Math.round(filled * 100 / open) : 100;
  h += '<div class="card panel"><div class="ring" style="--p:' + pct + '"><span class="num">' + filled + '/' + open + '</span></div><div>' +
    '<b>' + (m.locked ? '確定しました 🔒' : filled >= open ? '入力完了！ありがとう 🎉' : 'あと ' + (open - filled) + ' 日 えらんでね') + '</b>' +
    '<div class="note">' + (m.locked ? '変更は担当者に連絡してください' : '〆切：毎月20日　選んだボタンをもう一度押すと取り消し') + '</div></div></div>';
  if (!info.fixed) {
    var n = m.desired[S.me] == null ? 0 : m.desired[S.me];
    h += '<div class="card count"><div><b>' + m.month + '月に出たい回数</b><div class="note">目安です（±1回ずれることがあります）</div></div>' +
      '<div class="stepper"><button data-cnt="-1"' + (m.locked ? ' disabled' : '') + '>−</button><span>' + n + '</span><button data-cnt="1"' + (m.locked ? ' disabled' : '') + '>＋</button></div></div>';
  }
  h += '<div class="grid">';
  m.days.forEach(function (d, i) {
    var cl = clinicsFor(d, info), p = pref[i] || '';
    var fixed = p === 'K' || p === 'B';
    h += '<div class="card day ' + (fixed ? 'stF' : p ? 'st' + p : '') + '"><div class="day-h">' + dateHtml(d.label) + '<div class="tags">' +
      (cl.length ? cl.map(function (c) { return tag(c); }).join('') : '<span class="note">出勤なし</span>') + '</div></div>';
    if (d.memo) h += '<div class="memo">📌 ' + esc(d.memo) + '</div>';
    if (!cl.length) { h += '<div class="note">この日はあなたの出勤先の診療がありません</div></div>'; return; }
    if (fixed) { h += '<div class="fixed">担当者が出勤で確定しました（' + (p === 'K' ? '熊本' : d.branch) + '）</div></div>'; return; }
    var dis = m.locked ? ' disabled' : '';
    h += '<div class="seg">' +
      '<button class="opt s3' + (p === '3' ? ' on' : '') + '" data-day="' + i + '" data-v="3"' + dis + '>出勤できます</button>' +
      '<button class="opt s1' + (p === '1' ? ' on' : '') + '" data-day="' + i + '" data-v="1"' + dis + '>休み希望<small>予定があるため</small></button>' +
      '</div></div>';
  });
  h += '</div>';
  h += '<div class="note" style="padding:2px 6px 10px">何も選ばない日は「出勤しない」扱いになります。</div>';
  return h;
}

// ---- シフトを見る ----
function renderShift(m) {
  var r = m.result, h = '', isAd = S.me === '__admin__';
  if (!r) return '<div class="card empty">まだシフトが作られていません</div>';
  h += m.locked ? '<div class="banner lock">🔒 確定したシフトです</div>'
    : '<div class="banner todo">⏳ 作成中のシフトです。みんなの入力で変わることがあります' + (r.unfilled ? '（あと ' + r.unfilled + ' 枠 募集中）' : '') + '</div>';
  if (!isAd) {
    var mine = [];
    m.days.forEach(function (d, i) {
      var x = r.days[i]; if (!x) return;
      x.k.forEach(function (p) { if (p[0] === S.me) mine.push([d.label, '熊本']); });
      x.b.forEach(function (p) { if (p[0] === S.me) mine.push([d.label, d.branch]); });
    });
    var info = meInfo(), des = m.desired[S.me];
    h += '<div class="card me-card"><div class="ttl"><b>' + esc(S.me) + ' さんの出勤日</b><span>' + (info.fixed ? '' : '希望 ' + des + '回 → ') + mine.length + '回</span></div>';
    h += mine.length ? '<ul class="mine">' + mine.map(function (x) { return '<li><span class="d">' + esc(md(x[0])) + '<small>SAT</small></span>' + tag(x[1]) + '</li>'; }).join('') + '</ul>'
      : '<div class="empty">この月の出勤はありません 🌿</div>';
    if (!info.fixed && Math.abs(mine.length - des) >= 2) h += '<div class="gapnote">⚠ 希望の回数と ' + Math.abs(mine.length - des) + ' 回ちがいます。気になる場合はシフト係へ</div>';
    h += '</div><div class="sec">みんなのシフト</div>';
  }
  h += '<div class="grid">';
  m.days.forEach(function (d, i) {
    var x = r.days[i]; if (!x) return;
    h += '<div class="card"><div class="day-h">' + dateHtml(d.label) + '</div>';
    if (d.memo) h += '<div class="memo">📌 ' + esc(d.memo) + '</div>';
    h += '<div class="cols">' + [[d.branch, x.b, x.bs, d.bNeed, ''], ['熊本', x.k, x.ks, d.kNeed, d.doctor]].map(function (c) {
      if (!c[3]) return '<div class="col"><div class="col-h">' + (c[0] ? tag(c[0]) : '<span class="note">分院</span>') + '</div><div class="note">休診</div></div>';
      return '<div class="col"><div class="col-h">' + tag(c[0], c[4]) + '<span class="n">' + c[3] + '人</span></div><div class="names">' +
        c[1].map(function (p) { return '<div class="nm' + (p[0] === S.me ? ' me' : '') + '"><span>' + esc(p[0]) + '</span><span class="c">' + (p[1] ? CIRC[p[1]] || '' : '') + '</span></div>'; }).join('') +
        (c[2] ? '<div class="nm short">あと' + c[2] + '人</div>' : '') + '</div></div>';
    }).join('') + '</div></div>';
  });
  h += '</div>';
  return h;
}

// ---- シフト係：修正する ----
function prefWord(p) { return p === '3' ? ['出勤OK', 's3'] : p === '1' ? ['休み希望', 's1'] : p === 'K' || p === 'B' ? ['確定', 's3'] : ['未回答', 's0']; }
function renderAdmin(m) {
  var r = m.result, h = '';
  var warn = r && r.warn || [];
  h += '<div class="card"><div class="panel"><div class="ring" style="--p:' + (r && !r.unfilled ? 100 : 60) + '"><span>' + (m.locked ? '🔒' : r && !r.unfilled ? '✓' : '!') + '</span></div><div>' +
    '<b>' + (m.locked ? '確定済み' : !r ? '未作成' : r.unfilled ? 'あと ' + r.unfilled + ' 枠 足りません' : 'すべての枠がうまりました') + '</b>' +
    '<div class="note">人を ✕ で外す／＋で追加すると、残りは自動で組み直されます</div></div></div>';
  if (warn.length) h += '<div class="mini">希望回数と2回以上ちがう人：</div><div class="warnlist">' + warn.map(function (w) { return '<span>' + esc(w.name) + ' 希望' + w.desired + '→' + w.total + '回</span>'; }).join('') + '</div>';
  h += '<div style="margin-top:12px"><button class="btn' + (m.locked ? ' ghost' : '') + '" data-act="lock">' + (m.locked ? '作成中にもどす' : 'この月のシフトを確定する') + '</button></div></div>';
  if (m.locked) return h + '<div class="note" style="padding:0 6px">確定中は修正できません。直すときは「作成中にもどす」を押してください。</div>';
  h += '<div class="grid">';
  m.days.forEach(function (d, i) {
    var x = r && r.days[i];
    h += '<div class="card"><div class="day-h">' + dateHtml(d.label) + '</div>';
    if (d.memo) h += '<div class="memo">📌 ' + esc(d.memo) + '</div>';
    h += '<div class="row"><span class="lb">熊本</span><div class="chips">' + ['院', '後', '園', '福', '休診'].map(function (v) {
      return '<button class="chip' + (d.doctor === v ? ' on' : '') + '" data-ad="doctor" data-day="' + i + '" data-v="' + v + '">' + v + '</button>'; }).join('') + '</div></div>';
    h += '<div class="row"><span class="lb">分院</span><div class="chips">' + ['荒尾', '大牟田', '休診'].map(function (v) {
      return '<button class="chip' + (d.branchRaw === v ? ' on' : '') + '" data-ad="branch" data-day="' + i + '" data-v="' + v + '">' + v + '</button>'; }).join('') + '</div></div>';
    if (x) {
      h += '<div class="cols">' + [['B', d.branch, x.b, x.bs, d.bNeed, d.bx, 'bextra'], ['K', '熊本', x.k, x.ks, d.kNeed, d.kx, 'kextra']].map(function (c) {
        var col = '<div class="col"><div class="col-h">' + (c[1] ? tag(c[1]) : '<span class="note">分院</span>') + '</div>';
        if (!c[4] && !c[5]) return col + '<div class="note">休診</div></div>';
        col += '<div class="stepper sm" style="margin-bottom:8px"><button data-ad="' + c[6] + '" data-day="' + i + '" data-v="' + ((c[5] || 0) - 1) + '">−</button><span class="num">' + c[4] + '人</span><button data-ad="' + c[6] + '" data-day="' + i + '" data-v="' + ((c[5] || 0) + 1) + '">＋</button></div>';
        col += '<div class="names">' + c[2].map(function (p) {
          return '<div class="nm' + (p[3] ? ' man' : '') + '"><span>' + (p[3] ? '📌' : '') + esc(p[0]) + (p[4] ? '<span class="vet">★</span>' : '') + '</span><button class="x" data-ad="assign" data-day="' + i + '" data-name="' + esc(p[0]) + '" data-v="X">✕</button></div>'; }).join('') +
          (c[3] ? '<div class="nm short">あと' + c[3] + '人</div>' : '') +
          '<button class="add" data-act="addsheet" data-day="' + i + '" data-c="' + c[0] + '">＋ 追加</button></div></div>';
        return col;
      }).join('') + '</div>';
      if (x.rm && x.rm.length) h += '<div class="mini">外した人：' + x.rm.map(function (n) { return '<b>' + esc(n) + '</b> <button class="chip" data-ad="assign" data-day="' + i + '" data-name="' + esc(n) + '" data-v="">もどす</button>'; }).join(' ') + '</div>';
      if (x.na && x.na.length) h += '<div class="mini">未回答：' + esc(x.na.join('・')) + '</div>';
      if (x.vg) h += '<div class="mini" style="color:var(--warn-ink);font-weight:700">⚠ 分院のベテランが' + (x.vg < 0 ? 'あと' + (-x.vg) + '人ほしい' : x.vg + '人多い') + '（★＝ベテラン。4人の日は2人、5人の日は2〜3人が目安）</div>';
    }
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function openAdd(day, c) {
  var m = month(), d = m.days[day], x = m.result && m.result.days[day];
  var inDay = {}; if (x) { x.k.forEach(function (p) { inDay[p[0]] = '熊本'; }); x.b.forEach(function (p) { inDay[p[0]] = d.branch; }); }
  var list = S.data.staff.filter(function (s) { return (c === 'K' ? s.where !== '分院のみ' : s.where !== '熊本のみ'); });
  var others = S.data.staff.filter(function (s) { return list.indexOf(s) < 0; });
  var item = function (s) {
    var p = (m.pref[s.name] || [])[day] || '', w = prefWord(p), cnt = m.result && m.result.cnt[s.name] ? m.result.cnt[s.name][0] : 0;
    return '<button class="cand" data-ad="assign" data-day="' + day + '" data-name="' + esc(s.name) + '" data-v="' + c + '"><span>' + esc(s.name) +
      '<small>' + (s.vet ? '★ベテラン・' : '') + '今月 ' + cnt + '回 / 希望 ' + (m.desired[s.name] == null ? '-' : m.desired[s.name]) + '回' + (inDay[s.name] ? '・この日は' + inDay[s.name] : '') + '</small></span><span class="st ' + w[1] + '">' + w[0] + '</span></button>';
  };
  $('sheet').innerHTML = '<div class="grip"></div><h3>' + esc(md(d.label)) + ' ' + (c === 'K' ? '熊本' : esc(d.branch)) + ' に追加</h3>' +
    list.map(item).join('') + (others.length ? '<div class="sec">ふだんは別の院の人</div>' + others.map(item).join('') : '');
  $('sheet').classList.add('show'); $('shade').classList.add('show');
}
function closeSheet() { $('sheet').classList.remove('show'); $('shade').classList.remove('show'); }

function save(day, v) {
  var m = month(), pref = m.pref[S.me];
  if (day === 'desired') m.desired[S.me] = v; else pref[day] = v;   // 先に画面を変える
  render();
  call('apiSave', [S.me, m.key, day, v], function (d) { S.data = d; if (!S.busy) render(); toast('✓ 保存しました'); });
}

$('shade').addEventListener('click', closeSheet);
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || b.disabled) return;
  var ds = b.dataset;
  if (ds.me) { S.me = ds.me; S.tab = 'in'; store('shift_me', S.me); render(); window.scrollTo(0, 0); return; }
  if (ds.act === 'pinmode') { S.pinMode = true; render(); return; }
  if (ds.act === 'pinback') { S.pinMode = false; render(); return; }
  if (ds.act === 'pinok') {
    var pin = $('pin').value.trim(); if (!pin) return;
    call('apiAdmin', [pin, 'check', {}], function (d) { S.data = d; S.pin = pin; S.me = '__admin__'; S.tab = 'ad'; S.pinMode = false; store('shift_pin', pin); store('shift_me', S.me); render(); });
    return;
  }
  if (b.id === 'who') {
    if (confirm(S.me === '__admin__' ? 'シフト係モードを終わりますか？' : '名前を選び直しますか？')) { S.me = null; S.pin = null; store('shift_me', null); store('shift_pin', null); render(); }
    return;
  }
  if (ds.mk) { S.mk = ds.mk; render(); window.scrollTo(0, 0); return; }
  if (ds.tab) { S.tab = ds.tab; render(); window.scrollTo(0, 0); return; }
  if (ds.act === 'lock') { var m0 = month(); if (confirm(m0.locked ? '作成中にもどしますか？' : m0.month + '月のシフトを確定しますか？（スタッフは変更できなくなります）')) admin('lock', { key: m0.key, value: !m0.locked }); return; }
  if (ds.act === 'addsheet') { openAdd(+ds.day, ds.c); return; }
  if (ds.ad) { closeSheet(); admin(ds.ad, { key: S.mk, day: +ds.day, name: ds.name, value: ds.ad === 'kextra' || ds.ad === 'bextra' ? Number(ds.v) : ds.v }); return; }
  if (ds.day != null && ds.v) {
    var m = month(), cur = m.pref[S.me][+ds.day];
    save(+ds.day, cur === ds.v ? '' : ds.v);
    return;
  }
  if (ds.cnt) {
    var m2 = month(), n = Math.max(0, Math.min(5, (m2.desired[S.me] || 0) + Number(ds.cnt)));
    if (n !== m2.desired[S.me]) save('desired', n);
  }
});
load();
</script>
